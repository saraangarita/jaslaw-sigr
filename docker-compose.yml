services:
  web:
    build:
      context: .
      target: runtime
    image: jaslaw:local
    container_name: jaslaw-web
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
